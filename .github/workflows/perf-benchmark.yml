name: perf-benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC

jobs:
  benchmark:
    name: Run perf benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run perf harness (generate + benchmark)
        run: |
          python tools/perf/generate_synthetic_data.py --rows 1000 --out tools/perf/ci_synth.csv
          python tools/perf/benchmark_runner.py --command "python tools/perf/generate_synthetic_data.py --rows 1000 --out tools/perf/ci_synth.csv" --iterations 3 --warmup 1 --shell > tools/perf/ci_benchmark.log

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: perf-artifacts
          path: |
            tools/perf/ci_synth.csv
            tools/perf/ci_benchmark.log
