name: Create repository labels

permissions:
  issues: write

on:
  workflow_dispatch:

jobs:
  create_labels:
    name: Create labels used by agent workflows
    runs-on: ubuntu-latest
    steps:
      - name: Ensure `needs-agent-prompt` label exists
        uses: actions/github-script@v7
        with:
          script: |
            const label = {
              name: 'needs-agent-prompt',
              color: 'fbca04',
              description: 'PR opened by a bot that requires an Agent Prompt in the PR body.'
            };
            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label.name });
              console.log(`Label '${label.name}' already exists`);
            } catch (e) {
              if (e.status === 404) {
                await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label.name, color: label.color, description: label.description });
                console.log(`Created label '${label.name}'`);
              } else {
                throw e;
              }
            }