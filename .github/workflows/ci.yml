name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Backend Workspace
        run: |
          cd backend
          cargo build --workspace --verbose

      - name: Test Backend Workspace
        run: |
          cd backend
          cargo test --workspace --verbose

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/valuator-studio/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend/valuator-studio
          npm ci

      - name: Build Frontend
        run: |
          cd frontend/valuator-studio
          npm run build

      - name: Lint Frontend
        run: |
          cd frontend/valuator-studio
          npm run lint
