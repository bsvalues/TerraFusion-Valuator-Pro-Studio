[package]
name = "valuator-api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "valuator-api"
path = "src/main.rs"

[dependencies]
valuator-core = { path = "../valuator-core" }
actix-web = "4"
actix-cors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
env_logger = "0.11"
log = "0.4"
dotenv = "0.15"
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
