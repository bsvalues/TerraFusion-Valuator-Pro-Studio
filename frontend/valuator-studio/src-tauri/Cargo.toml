[package]
name = "valuator_studio_tauri"
version = "0.1.0"
edition = "2021"

[dependencies]
# Minimal Tauri runtime
tauri = "1"
# Small local SQLite wrapper
rusqlite = { version = "0.29", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[build-dependencies]
# no build-deps yet
tauri-build = "1"
